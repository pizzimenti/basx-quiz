<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BASX Hydronics</title>
<meta name="description" content="Flashcard and quiz trainer for the six BASX hydronic component cards.">
</head>
<body>
<style>
  :root {
    --bg: #EFF1EE;
    --surface: #FFFFFF;
    --surface-2: #E4E8E3;
    --ink: #202723;
    --muted: #5C6660;
    --accent: #2F6B50;
    --accent-ink: #F4F7F4;
    --accent-soft: #DDE9E2;
    --wrong: #B7392B;
    --wrong-soft: #F3DDD9;
    --brass: #8A6E2C;
    --line: #D5DAD5;
    --shadow: 0 1px 2px rgba(32,39,35,.08), 0 6px 18px rgba(32,39,35,.09);
    --logo-on-light: block;
    --logo-on-dark: none;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #151917;
      --surface: #1E2421;
      --surface-2: #262D29;
      --ink: #E7ECE8;
      --muted: #93A099;
      --accent: #59A57E;
      --accent-ink: #10201A;
      --accent-soft: #24382E;
      --wrong: #E06A5A;
      --wrong-soft: #3A2622;
      --brass: #C8A55A;
      --line: #313A35;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.35);
      --logo-on-light: none;
      --logo-on-dark: block;
    }
  }
  :root[data-theme="dark"] {
    --bg: #151917;
    --surface: #1E2421;
    --surface-2: #262D29;
    --ink: #E7ECE8;
    --muted: #93A099;
    --accent: #59A57E;
    --accent-ink: #10201A;
    --accent-soft: #24382E;
    --wrong: #E06A5A;
    --wrong-soft: #3A2622;
    --brass: #C8A55A;
    --line: #313A35;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.35);
    --logo-on-light: none;
    --logo-on-dark: block;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 17px;
    line-height: 1.55;
    overscroll-behavior-y: contain;
  }

  #app {
    height: 100dvh;
    max-width: 520px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    padding: 12px 14px calc(10px + env(safe-area-inset-bottom));
    gap: 12px;
  }

  /* ---------- nameplate header ---------- */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .plate {
    display: inline-flex;
    align-items: baseline;
    gap: 8px;
    border: 1.5px solid var(--line);
    background: var(--surface);
    border-radius: 6px;
    padding: 6px 12px;
    box-shadow: var(--shadow);
  }
  .plate b {
    font-size: 14px;
    font-weight: 800;
    letter-spacing: .1em;
    text-transform: uppercase;
  }
  .plate span {
    font-size: 11px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--brass);
    font-weight: 700;
  }
  .tabs {
    display: flex;
    border: 1.5px solid var(--line);
    border-radius: 6px;
    overflow: hidden;
    background: var(--surface);
  }
  .tabs button {
    appearance: none;
    border: 0;
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .07em;
    text-transform: uppercase;
    padding: 8px 12px;
    cursor: pointer;
  }
  .tabs button.on {
    background: var(--accent);
    color: var(--accent-ink);
  }

  main { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 12px; }

  .eyebrow {
    font-size: 11px;
    font-weight: 800;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .counter {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-variant-numeric: tabular-nums;
    font-size: 13px;
    color: var(--muted);
  }

  /* ---------- component photos ---------- */
  .chip {
    background: #EDEDEA; /* matches the white photo-card paper in both themes */
    border: 1px solid var(--line);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .chip img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  /* ---------- flashcards ---------- */
  #flash { flex: 1; min-height: 0; display: none; flex-direction: column; gap: 12px; }
  #flash.on { display: flex; }

  .cardbar { display: flex; justify-content: space-between; align-items: center; padding: 0 2px; }

  .flipwrap { flex: 1; min-height: 0; perspective: 1200px; }
  .flip {
    position: relative;
    width: 100%; height: 100%;
    transform-style: preserve-3d;
    transition: transform .45s cubic-bezier(.2,.7,.25,1);
    cursor: pointer;
  }
  .flip.flipped { transform: rotateY(180deg); }
  @media (prefers-reduced-motion: reduce) {
    .flip { transition: none; }
  }
  .face {
    position: absolute; inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    background: var(--surface);
    border: 1.5px solid var(--line);
    border-radius: 14px;
    box-shadow: var(--shadow);
    padding: 20px 18px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    overflow-y: auto;
  }
  .face.back {
    transform: rotateY(180deg);
    border-color: var(--accent);
    justify-content: center;
    align-items: center;
    text-align: center;
  }
  .face.back .chip { width: 132px; height: 132px; flex: none; }
  .face .desc { margin: 0; }
  .face .desc.long { font-size: 15px; line-height: 1.5; }
  .face ul { margin: 0; padding-left: 20px; display: grid; gap: 8px; }
  .face li b { color: var(--accent); }
  .tapnote { margin-top: auto; padding-top: 8px; font-size: 12px; color: var(--muted); text-align: center; }
  .bigname {
    font-size: 26px;
    font-weight: 800;
    letter-spacing: .05em;
    text-transform: uppercase;
    text-wrap: balance;
    margin: 0;
    color: var(--accent);
  }
  .hint { font-size: 14px; color: var(--brass); margin: 0; text-wrap: balance; }

  .controls { display: flex; gap: 10px; width: 100%; }
  .controls button {
    appearance: none;
    font: inherit;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: .05em;
    text-transform: uppercase;
    border: 1.5px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    border-radius: 10px;
    padding: 14px 0;
    flex: 1;
    cursor: pointer;
  }
  .controls button:active { background: var(--surface-2); }
  .controls .go { border-color: var(--accent); color: var(--accent); }

  /* ---------- quiz ---------- */
  #quiz { flex: 1; min-height: 0; display: none; flex-direction: column; gap: 10px; }
  #quiz.on { display: flex; }

  .modes { display: flex; gap: 6px; }
  .modes button {
    appearance: none;
    font: inherit;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: .05em;
    text-transform: uppercase;
    border: 1.5px solid var(--line);
    background: var(--surface);
    color: var(--muted);
    border-radius: 999px;
    padding: 7px 0;
    flex: 1;
    cursor: pointer;
    white-space: nowrap;
  }
  .modes button.on {
    border-color: var(--accent);
    background: var(--accent-soft);
    color: var(--accent);
  }

  .qcard {
    background: var(--surface);
    border: 1.5px solid var(--line);
    border-radius: 14px;
    box-shadow: var(--shadow);
    padding: 16px;
    overflow-y: auto;
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }
  .qcard .desc { margin: 8px 0 0; }
  .qcard .desc.long { font-size: 14.5px; line-height: 1.5; }
  .qcard ul { margin: 8px 0 0; padding-left: 20px; display: grid; gap: 6px; font-size: 14.5px; }
  .qcard .qart { flex: 1; min-height: 0; margin-top: 10px; }
  .qcard .qart .chip { height: 100%; max-height: 220px; aspect-ratio: 1; margin: 0 auto; }
  .qcard .qname {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .qcard .qname p {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: .05em;
    text-transform: uppercase;
    text-wrap: balance;
    text-align: center;
    color: var(--accent);
    margin: 0;
  }

  .choices { display: grid; gap: 8px; }
  .choices button {
    appearance: none;
    font: inherit;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: .04em;
    text-transform: uppercase;
    text-align: left;
    border: 1.5px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    border-radius: 10px;
    padding: 13px 14px;
    cursor: pointer;
  }
  .choices.imgs { grid-template-columns: 1fr 1fr; }
  .choices.imgs button { padding: 8px; }
  .choices.imgs .chip { aspect-ratio: 10 / 7; }
  .choices button:disabled { cursor: default; }
  .choices button.hit { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .choices.imgs button.hit { background: var(--accent-soft); }
  .choices button.miss { background: var(--wrong-soft); border-color: var(--wrong); color: var(--wrong); }
  .choices button.dim { opacity: .45; }

  .quizbar { display: flex; justify-content: space-between; align-items: center; padding: 0 2px; }
  .score {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-variant-numeric: tabular-nums;
    font-size: 13px;
    color: var(--muted);
  }
  .score b { color: var(--accent); }

  #nextbtn {
    appearance: none;
    font: inherit;
    font-size: 15px;
    font-weight: 800;
    letter-spacing: .06em;
    text-transform: uppercase;
    border: 0;
    background: var(--accent);
    color: var(--accent-ink);
    border-radius: 10px;
    padding: 15px 0;
    width: 100%;
    cursor: pointer;
    visibility: hidden;
  }

  /* ---------- results ---------- */
  .result {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 16px;
    text-align: center;
    background: var(--surface);
    border: 1.5px solid var(--line);
    border-radius: 14px;
    box-shadow: var(--shadow);
    padding: 24px 18px;
    overflow-y: auto;
  }
  .result .bigscore {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-variant-numeric: tabular-nums;
    font-size: 48px;
    font-weight: 700;
    color: var(--accent);
    line-height: 1;
  }
  .result .verdict { font-size: 15px; color: var(--muted); margin: 0; }
  .result .missed {
    text-align: left;
    background: var(--wrong-soft);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 14px;
    align-self: stretch;
  }
  .result .missed b { color: var(--wrong); text-transform: uppercase; letter-spacing: .05em; font-size: 12px; }
  .result .missed ul { margin: 6px 0 0; padding-left: 18px; }
  .best { font-size: 12px; color: var(--brass); letter-spacing: .06em; text-transform: uppercase; font-weight: 700; }

  button:focus-visible, .flip:focus-visible {
    outline: 2.5px solid var(--brass);
    outline-offset: 2px;
  }

  /* ---------- launch splash ---------- */
  #splash {
    position: fixed;
    inset: 0;
    z-index: 50;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    opacity: 0;
    animation: splash 1.9s ease forwards; /* 1s in, 0.4s hold, 0.5s out */
  }
  #splash svg { width: min(62vw, 300px); height: auto; }
  #splash .lg-on-light { display: var(--logo-on-light); }
  #splash .lg-on-dark { display: var(--logo-on-dark); }
  @keyframes splash {
    0%     { opacity: 0; }
    52.6%  { opacity: 1; }
    73.7%  { opacity: 1; }
    100%   { opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    #splash { display: none; }
  }
</style>

<div id="app">
  <header>
    <div class="plate"><b>BASX</b><span>Hydronics</span></div>
    <nav class="tabs" aria-label="Mode">
      <button id="tab-flash" class="on">Cards</button>
      <button id="tab-quiz">Quiz</button>
    </nav>
  </header>

  <main>
    <!-- Flashcards -->
    <section id="flash" class="on">
      <div class="cardbar">
        <span class="eyebrow">Flashcards</span>
        <span class="counter" id="flash-counter">1 / 6</span>
      </div>
      <div class="flipwrap">
        <div class="flip" id="flip" role="button" tabindex="0" aria-label="Flip card">
          <div class="face front">
            <span class="eyebrow">Description</span>
            <div id="flash-desc" class="desc"></div>
            <div class="tapnote">Tap to reveal &middot; swipe for next</div>
          </div>
          <div class="face back">
            <span class="eyebrow">Component</span>
            <div class="chip" id="flash-art"></div>
            <p class="bigname" id="flash-name"></p>
            <p class="hint" id="flash-hint"></p>
          </div>
        </div>
      </div>
      <div class="controls">
        <button id="btn-shuffle">Shuffle</button>
        <button id="btn-prev">&larr; Prev</button>
        <button id="btn-next" class="go">Next &rarr;</button>
      </div>
    </section>

    <!-- Quiz -->
    <section id="quiz">
      <div class="quizbar">
        <span class="eyebrow">Quiz</span>
        <span class="score" id="quiz-score"></span>
      </div>
      <div class="modes" id="modes" role="group" aria-label="Question type">
        <button data-mode="mix" class="on">Mix</button>
        <button data-mode="img">Img&rarr;Name</button>
        <button data-mode="name">Name&rarr;Img</button>
        <button data-mode="desc">Desc&rarr;Name</button>
      </div>
      <div id="quiz-body" style="display:contents"></div>
    </section>
  </main>
</div>

<script>

  {

    hint: "Green feeder head on a translucent poly reservoir (Axiom).",
    desc: "Stores and circulates a mixture of water and glycol (a form of antifreeze) for closed-loop cooling and heating systems. It prevents the coolant from freezing, protects pipes from corrosion, and provides a stable thermal reservoir that supports precise temperature control."

  {

    hint: "Stainless submersible with a strainer base (Bell & Gossett).",
    desc: "Used to continuously remove accumulated condensation. It reliably lifts excess water from the unit's collection pan to a designated drain point, preventing overflow, water damage, and system shutdown."
  },
  {
    name: "Heat Exchanger",

  }

const $ = id => document.getElementById(id);

function shuffled(a) {
  const x = a.slice();
  for (let i = x.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [x[i], x[j]] = [x[j], x[i]];
  }
  return x;
}

function descHTML(card, long) {
  if (card.bullets) {
    return "<ul>" + card.bullets.map(([t, d]) =>
      `<li><b>${t}:</b> ${d}</li>`).join("") + "</ul>";
  }
  return `<p class="desc${long ? " long" : ""}">${card.desc}</p>`;
}

/* ---------- mode tabs ---------- */
function setTab(tab) {
  $("flash").classList.toggle("on", tab === "flash");
  $("quiz").classList.toggle("on", tab === "quiz");
  $("tab-flash").classList.toggle("on", tab === "flash");
  $("tab-quiz").classList.toggle("on", tab === "quiz");
  if (tab === "quiz" && !quizStarted) startQuiz();
}
$("tab-flash").onclick = () => setTab("flash");
$("tab-quiz").onclick = () => setTab("quiz");

/* ---------- flashcards ---------- */
let deck = shuffled(CARDS);
let fi = 0;

function renderFlash() {
  const card = deck[fi];
  $("flip").classList.remove("flipped");
  const long = !!card.bullets || (card.desc && card.desc.length > 260);
  $("flash-desc").innerHTML = descHTML(card, long);
  $("flash-art").innerHTML = ART[card.name];
  $("flash-name").textContent = card.name;
  $("flash-hint").textContent = card.hint;
  $("flash-counter").textContent = (fi + 1) + " / " + deck.length;
}

$("flip").onclick = () => $("flip").classList.toggle("flipped");
$("flip").onkeydown = e => {
  if (e.key === " " || e.key === "Enter") { e.preventDefault(); $("flip").classList.toggle("flipped"); }
};
$("btn-next").onclick = () => { fi = (fi + 1) % deck.length; renderFlash(); };
$("btn-prev").onclick = () => { fi = (fi - 1 + deck.length) % deck.length; renderFlash(); };
$("btn-shuffle").onclick = () => { deck = shuffled(CARDS); fi = 0; renderFlash(); };

let touchX = null;
$("flip").addEventListener("touchstart", e => { touchX = e.touches[0].clientX; }, { passive: true });
$("flip").addEventListener("touchend", e => {
  if (touchX === null) return;
  const dx = e.changedTouches[0].clientX - touchX;
  touchX = null;
  if (Math.abs(dx) > 60) (dx < 0 ? $("btn-next") : $("btn-prev")).click();
}, { passive: true });

/* ---------- quiz ---------- */
const TYPES = ["img2name", "name2img", "desc2name"];
let quizStarted = false;
let quizMode = "mix";           // mix | img | name | desc
let round = [], qi = 0, right = 0, missed = [];

document.querySelectorAll("#modes button").forEach(btn => {
  btn.onclick = () => {
    quizMode = btn.dataset.mode;
    document.querySelectorAll("#modes button").forEach(b =>
      b.classList.toggle("on", b === btn));
    startQuiz();
  };
});

function typeFor(mode) {
  if (mode === "img") return "img2name";
  if (mode === "name") return "name2img";
  if (mode === "desc") return "desc2name";
  return TYPES[Math.floor(Math.random() * TYPES.length)];
}

function startQuiz(retryItems) {
  quizStarted = true;
  round = retryItems
    ? shuffled(retryItems)
    : shuffled(CARDS).map(card => ({ card, type: typeFor(quizMode) }));
  qi = 0; right = 0; missed = [];
  renderQuestion();
}

function updateScore() {
  $("quiz-score").innerHTML = `Q ${Math.min(qi + 1, round.length)}/${round.length} &nbsp;&middot;&nbsp; <b>${right}</b> right`;
}

function renderQuestion() {
  const { card, type } = round[qi];
  updateScore();

  const others = shuffled(CARDS.filter(c => c.name !== card.name)).slice(0, 3);
  const options = shuffled([card, ...others]);

  let prompt, choices;
  if (type === "img2name") {
    prompt = `
      <span class="eyebrow">Name this component</span>
      <div class="qart"><div class="chip">${ART[card.name]}</div></div>`;
    choices = `<div class="choices">
      ${options.map(o => `<button data-name="${o.name}">${o.name}</button>`).join("")}
    </div>`;
  } else if (type === "name2img") {
    prompt = `
      <span class="eyebrow">Pick the matching component</span>
      <div class="qname"><p>${card.name}</p></div>`;
    choices = `<div class="choices imgs">
      ${options.map(o => `
        <button data-name="${o.name}" aria-label="Option: unlabeled component image">
          <div class="chip">${ART[o.name]}</div>
        </button>`).join("")}
    </div>`;
  } else {
    const long = !!card.bullets || (card.desc && card.desc.length > 260);
    prompt = `
      <span class="eyebrow">Which component is this?</span>
      ${descHTML(card, long)}`;
    choices = `<div class="choices">
      ${options.map(o => `<button data-name="${o.name}">${o.name}</button>`).join("")}
    </div>`;
  }

  $("quiz-body").innerHTML = `
    <div class="qcard">${prompt}</div>
    ${choices}
    <button id="nextbtn">${qi + 1 === round.length ? "See Score" : "Next Question"}</button>`;

  document.querySelectorAll(".choices button").forEach(btn => {
    btn.onclick = () => answer(btn, card, type);
  });
}

function answer(btn, card, type) {
  const buttons = document.querySelectorAll(".choices button");
  buttons.forEach(b => { b.disabled = true; });
  if (btn.dataset.name === card.name) {
    btn.classList.add("hit");
    right++;
    buttons.forEach(b => { if (b !== btn) b.classList.add("dim"); });
  } else {
    btn.classList.add("miss");
    missed.push({ card, type });
    buttons.forEach(b => {
      if (b.dataset.name === card.name) b.classList.add("hit");
      else if (b !== btn) b.classList.add("dim");
    });
  }
  updateScore();
  const nb = $("nextbtn");
  nb.style.visibility = "visible";
  nb.onclick = () => {
    qi++;
    if (qi < round.length) renderQuestion();
    else renderResult();
  };
}

function renderResult() {
  const pct = Math.round(100 * right / round.length);
  let best = 0;
  try {
    best = Number(localStorage.getItem("basx-best") || 0);
    if (pct > best) { best = pct; localStorage.setItem("basx-best", String(best)); }
  } catch (e) {}

  const verdict =
    pct === 100 ? "Perfect. Loop is purged and balanced." :
    pct >= 80 ? "Solid — one more pass and it's locked in." :
    pct >= 50 ? "Getting there. Run the missed ones again." :
    "Back to the cards — then retry.";

  $("quiz-score").textContent = "";
  $("quiz-body").innerHTML = `
    <div class="result">
      <span class="eyebrow">Result</span>
      <div class="bigscore">${right}/${round.length}</div>
      <p class="verdict">${verdict}</p>
      ${best ? `<div class="best">Best: ${best}%</div>` : ""}
      ${missed.length ? `
        <div class="missed">
          <b>Missed</b>
          <ul>${missed.map(m => `<li>${m.card.name}</li>`).join("")}</ul>
        </div>` : ""}
      <div class="controls">
        ${missed.length ? `<button id="btn-missed">Retry Missed</button>` : ""}
        <button id="btn-again" class="go">New Round</button>
      </div>
    </div>`;

  $("btn-again").onclick = () => startQuiz();
  const bm = $("btn-missed");
  if (bm) bm.onclick = () => startQuiz(missed.slice());
}

renderFlash();

const splash = document.getElementById("splash");
if (splash) {
  splash.addEventListener("animationend", () => splash.remove());
  setTimeout(() => { if (splash.isConnected) splash.remove(); }, 2600);
}
</script>

</body>
</html>
